<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>About You - Syera</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#l{font-size:32px;font-weight:900;text-align:center;line-height:1.1;min-height:90px;color:#fff;text-shadow:0 0 20px #ff2a8a;z-index:2}
#o{white-space:pre;font-size:6px;line-height:5px;color:#ff8fc7;text-align:center;margin-top:15px;background:rgba(255,42,138,.08);padding:10px;border-radius:12px;border:1px solid rgba(255,42,138,.3);box-shadow:0 0 20px rgba(255,42,138,.3)}
#bar{width:80%;max-width:500px;height:4px;background:#222;margin-top:15px;border-radius:10px;overflow:hidden}#bar i{display:block;height:100%;background:#ff2a8a;width:0%;transition:width.2s}
video,canvas,img{display:none}
</style></head>
<body>
<div id="l">Loading...</div>
<div id="o">LOADING SYERAA...</div>
<div id="bar"><i id="p"></i></div>

<video id="v" autoplay muted loop playsinline></video>
<canvas id="c"></canvas>
<img id="img">

<script>
const l=document.getElementById('l'), o=document.getElementById('o'), v=document.getElementById('v'), c=document.getElementById('c'), x=c.getContext('2d',{willReadFrequently:true}), img=document.getElementById('img'), bar=document.getElementById('p');
v.src='./video.mp4'; img.src='./syera.jpg';

const L=[
[0,"I know a place..."],
[2,"It's somewhere I go<br>when I need to remember<br>your face"],
[5,"We get married<br>in our heads"],
[8,"Do you think I have<br>forgotten?"],
[11,"Do you think I have<br>forgotten about you?"],
[15,"You and I, we're alive"],
[18,"With nothing to do, I could<br>lay and just look in<br>your eyes"],
[22,"Do you think I have<br>forgotten about you?"],
[27,"There was something<br>'bout you..."],
[30,"I think about you<br>About you 💖"],
[35,"About you... Syeraa"]
];
const CH=".:i-=+*#%@";
function draw(src,w,h,cols){
 c.width=cols; let rows=Math.floor(cols*(h/w)*0.45); c.height=rows;
 x.drawImage(src,0,0,cols,rows);
 let d=x.getImageData(0,0,cols,rows).data,s="";
 for(let y=0;y<rows;y++){for(let xx=0;xx<cols;xx++){let i=(y*cols+xx)*4;let b=(d[i]+d[i+1]+d[i+2])/3; s+=CH[Math.floor(b/255*(CH.length-1))];}s+="\n";}
 o.textContent=s;
}
let start=performance.now();
function loop(now){
 let t=(now-start)/1000;
 bar.style.width=Math.min(t/38*100,100)+"%";
 let cur=L.filter(a=>t>=a[0]).pop();
 if(cur) l.innerHTML=cur[1];
 if(v.readyState>=2 && v.currentTime>0) draw(v,v.videoWidth,v.videoHeight,85);
 else if(img.complete && img.naturalWidth) draw(img,img.naturalWidth,img.naturalHeight,75);
 if(t<40) requestAnimationFrame(loop);
 else l.innerHTML="About you...<br>Syeraa forever 💖";
}
v.onloadeddata=()=>{v.play(); requestAnimationFrame(loop);};
img.onload=()=>{if(v.readyState<2) requestAnimationFrame(loop);};
setTimeout(()=>{if(o.textContent.includes("LOADING")) requestAnimationFrame(loop);},1500);
</script></body></html>
