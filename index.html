
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Syera - ASCII Love</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'JetBrains Mono',monospace;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#lyric{font-size:52px;font-weight:800;text-align:center;margin-top:60px;line-height:1.1;letter-spacing:-1px}
#output{white-space:pre;line-height:5px;font-size:5px;text-align:center;margin-top:20px;letter-spacing:1px}
#wave{width:720px;max-width:93vw;height:50px;display:flex;align-items:center;gap:3px;justify-content:center;margin:20px auto}
#wave span{width:4px;background:#fff;display:block;border-radius:10px;height:8px;transition:height.1s}
#bar{width:720px;max-width:93vw;height:4px;background:#222;margin:10px auto;border-radius:10px;overflow:hidden}
#bar-inner{height:100%;background:#fff;width:0%;transition:width.2s}
#top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10}
#top button{background:#111;border:1px solid #333;color:#fff;padding:10px 22px;border-radius:100px;cursor:pointer;font-weight:700}
video,canvas,img{display:none}
@media(max-width:600px){#lyric{font-size:26px;margin-top:70px}#output{font-size:3px;line-height:3px}}
</style>
</head>
<body>
<div id="top"><button id="playBtn">▶ PLAY FOR SYERA</button></div>
<div id="lyric">Only see your face<br>when I close my eyes</div>
<div id="output">Loading video...</div>
<div id="wave"></div>
<div id="bar"><div id="bar-inner"></div></div>
<video id="video" muted playsinline crossorigin="anonymous"></video>
<canvas id="canvas"></canvas>
<img id="img">

 output.textContent=txt;
}
